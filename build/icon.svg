  <g fill="#7DE9C8">
    <circle cx="770" cy="741" r="11" fill-opacity=".64"/>
    <circle cx="812" cy="741" r="7" fill-opacity=".36"/>
    <circle cx="844" cy="741" r="4" fill-opacity=".22"/>
  </g>
