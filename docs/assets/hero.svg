<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">JLaunch — Java Launch Control</title>
  <desc id="desc">A branded preview of the JLaunch Java process manager desktop application.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="1110" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#13263A"/><stop offset=".55" stop-color="#0B1624"/><stop offset="1" stop-color="#07101B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(190 96) rotate(40) scale(670 460)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D2A4" stop-opacity=".28"/><stop offset="1" stop-color="#35D2A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="72" y1="76" x2="247" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CF4D3"/><stop offset="1" stop-color="#31B18B"/>
    </linearGradient>
    <linearGradient id="play" x1="218" y1="100" x2="280" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD875"/><stop offset="1" stop-color="#FF8B50"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#D6FFF2" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="180%" height="180%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="460" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="458" rx="27" fill="none" stroke="#9CEFD6" stroke-opacity=".14" stroke-width="2"/>

